# Run everything locally with one command:  docker compose up --build
# then open http://localhost:7860
services:
  mongo:
    image: mongo:8.0
    volumes: [mongo-data:/data/db]
  app:
    build: .
    ports: ["7860:7860"]
    environment:
      MONGO_URI: mongodb://mongo:27017/cxr-rrg
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      DOCTOR_EMAIL: ${DOCTOR_EMAIL:-}
      DOCTOR_PASSWORD: ${DOCTOR_PASSWORD:-}
    depends_on: [mongo]
volumes:
  mongo-data:
